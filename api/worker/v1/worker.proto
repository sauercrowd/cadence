syntax = "proto3";

package worker.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/sauercrowd/worker/gen/worker/v1;workerv1";

message DocumentSummary {
  string id = 1;
  string name = 2;
  string filename = 3;
}

message Task {
  string id = 1;
  string name = 2;
  repeated DocumentSummary documents = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  TaskStatus status = 6;
  int32 priority = 7;
  AgentStatus agent_status = 8;
  reserved 9;
  string current_phase_id = 10;
  repeated TaskPhase phases = 11;
  string revision = 12;
}

enum TaskStatus { TASK_STATUS_UNSPECIFIED = 0; TASK_STATUS_OPEN = 1; TASK_STATUS_FOCUS = 2; TASK_STATUS_DONE = 3; TASK_STATUS_ARCHIVED = 4; }
enum AgentStatus { AGENT_STATUS_NONE = 0; AGENT_STATUS_WORKING = 1; }
message PhaseDefinition { string id = 1; string name = 2; reserved 3, 5, 7, 8; string mode = 4; string document_template = 6; }
message TaskPhase { PhaseDefinition definition = 1; string document_id = 2; reserved 3, 4, 5; }
message Workflow { repeated PhaseDefinition phases = 1; string revision = 2; }
message WorkspaceInfo { string id = 1; string name = 2; }
message UpdateTaskRequest { string id = 1; string revision = 2; string name = 3; TaskStatus status = 4; int32 priority = 5; AgentStatus agent_status = 6; reserved 7; google.protobuf.FieldMask update_mask = 8; string current_phase_id = 9; }
message RevisionTaskRequest { string id = 1; string revision = 2; }
message UpdateWorkflowRequest { Workflow workflow = 1; string revision = 2; }

message Document {
  string id = 1;
  string task_id = 2;
  string name = 3;
  string filename = 4;
  string content = 5;
  string revision = 6;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  repeated string errors = 2;
}

message CreateTaskRequest {
  string name = 1;
}

message TaskRequest {
  string task_id = 1;
}

message RenameTaskRequest {
  string task_id = 1;
  string name = 2;
}

message CreateDocumentRequest {
  string task_id = 1;
  string name = 2;
}

message DocumentRequest {
  string task_id = 1;
  string document_id = 2;
}

message RenameDocumentRequest {
  string task_id = 1;
  string document_id = 2;
  string name = 3;
}

message UpdateDocumentRequest {
  string task_id = 1;
  string document_id = 2;
  string content = 3;
  string revision = 4;
}

service WorkspaceService {
  rpc GetWorkspace(google.protobuf.Empty) returns (WorkspaceInfo) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetTask(TaskRequest) returns (Task) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc UpdateTask(UpdateTaskRequest) returns (Task) {}
  rpc ArchiveTask(RevisionTaskRequest) returns (Task) {}
  rpc RestoreTask(RevisionTaskRequest) returns (Task) {}
  rpc GetWorkflow(google.protobuf.Empty) returns (Workflow) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (Workflow) {}
  rpc ListTasks(google.protobuf.Empty) returns (ListTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateTask(CreateTaskRequest) returns (Task) {}
  rpc RenameTask(RenameTaskRequest) returns (Task) {}
  rpc DeleteTask(TaskRequest) returns (google.protobuf.Empty) {}
  rpc CreateDocument(CreateDocumentRequest) returns (Document) {}
  rpc GetDocument(DocumentRequest) returns (Document) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RenameDocument(RenameDocumentRequest) returns (Document) {}
  rpc UpdateDocument(UpdateDocumentRequest) returns (Document) {}
  rpc DeleteDocument(DocumentRequest) returns (google.protobuf.Empty) {}
}
